name: Formfeed templates
description: Validate and test Formfeed document templates, preview the ones a pull request changes, and publish them.
author: Formfeed
branding:
  icon: file-text
  color: purple

inputs:
  api-key:
    description: A Formfeed API key. Validation and tests run offline without one; previews and publishing need one. A test key (ff_test_) renders previews for free.
    required: false
    default: ''
  working-directory:
    description: The folder of the Formfeed project, the one that holds formfeed.json.
    required: false
    default: '.'
  version:
    description: The version of the formfeed command line the steps run.
    required: false
    default: '0.3.32'
  node-version:
    description: The Node.js version the command line runs on.
    required: false
    default: '22'
  validate:
    description: Run `formfeed validate`, which compiles and checks every template and fails on errors.
    required: false
    default: 'true'
  test:
    description: Run `formfeed test`, which checks every data set and compares its output with the approved snapshot.
    required: false
    default: 'true'
  preview:
    description: Render the templates changed since the base branch through the API. `auto` does it on pull requests when an API key is set; `true` and `false` decide it yourself.
    required: false
    default: 'auto'
  base:
    description: The git ref the preview compares against. Defaults to the pull request's base branch.
    required: false
    default: ''
  data-sets:
    description: Which data sets the preview renders. `all`, `default` (each template's default data set) or names separated by commas.
    required: false
    default: 'all'
  compare:
    description: Render each data set on the base branch too and compare the page counts. `auto` does it with a test key, which renders for free; `true` and `false` decide it yourself.
    required: false
    default: 'auto'
  fail-on-page-change:
    description: With `compare`, fail when a data set's page count differs from the base branch's.
    required: false
    default: 'true'
  page-change-label:
    description: While the pull request carries this label, a changed page count is reported and does not fail.
    required: false
    default: 'pages-changed'
  comment:
    description: "Post the preview's summary on the pull request, updating the action's own comment on every run. Needs `pull-requests: write`."
    required: false
    default: 'true'
  publish:
    description: Push the templates and publish them, with the commit as change note. Set it on your default branch only, with a live key.
    required: false
    default: 'false'
  channel:
    description: With `publish`, push to this release channel instead of publishing.
    required: false
    default: ''
  github-token:
    description: The token that writes the comment.
    required: false
    default: ${{ github.token }}

outputs:
  summary:
    description: The path of formfeed-preview.md, when a preview ran.
    value: ${{ steps.preview.outputs.summary }}
  pages-changed:
    description: How many data sets changed their page count against the base branch, when a preview compared them.
    value: ${{ steps.preview.outputs.pages-changed }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Validate
      if: inputs.validate == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORMFEED_VERSION: ${{ inputs.version }}
        FORMFEED_API_KEY: ${{ inputs.api-key }}
      run: npx --yes "formfeed@$FORMFEED_VERSION" validate --ci

    - name: Test
      if: inputs.test == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORMFEED_VERSION: ${{ inputs.version }}
        FORMFEED_API_KEY: ${{ inputs.api-key }}
      run: npx --yes "formfeed@$FORMFEED_VERSION" test --ci

    - name: Preview
      id: preview
      if: inputs.preview == 'true' || (inputs.preview == 'auto' && github.event_name == 'pull_request' && inputs.api-key != '')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORMFEED_VERSION: ${{ inputs.version }}
        FORMFEED_API_KEY: ${{ inputs.api-key }}
        BASE: ${{ inputs.base }}
        BASE_BRANCH: ${{ github.base_ref }}
        DATA_SETS: ${{ inputs.data-sets }}
        COMPARE: ${{ inputs.compare }}
        FAIL_ON_PAGE_CHANGE: ${{ inputs.fail-on-page-change }}
        LABELLED: ${{ contains(github.event.pull_request.labels.*.name, inputs.page-change-label) }}
      run: |
        # the preview compares against the base branch, so it needs the history up to it
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --quiet --unshallow origin
        fi
        if [ -z "$BASE" ]; then
          if [ -z "$BASE_BRANCH" ]; then
            echo '::error::No base to compare against: set the input `base` outside pull requests'
            exit 1
          fi
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
          BASE="origin/$BASE_BRANCH"
        fi
        echo "summary=$PWD/formfeed-preview.md" >> "$GITHUB_OUTPUT"
        args=(ci preview --base "$BASE" --ci)
        # a command line pinned to an older version knows neither option and previews as it always did
        # (read whole, not piped into grep -q, which can end the pipe early under pipefail)
        help="$(npx --yes "formfeed@$FORMFEED_VERSION" ci preview --help)"
        if [[ "$help" == *--compare* ]]; then
          args+=(--data-sets "$DATA_SETS")
          if [ "$COMPARE" = auto ]; then
            # a test key renders the base for free; with a live key the base would count units too
            case "$FORMFEED_API_KEY" in ff_test_*) COMPARE=true ;; *) COMPARE=false ;; esac
          fi
          if [ "$COMPARE" = true ]; then
            args+=(--compare)
            if [ "$FAIL_ON_PAGE_CHANGE" != true ] || [ "$LABELLED" = true ]; then
              args+=(--allow-page-changes)
            fi
          fi
        else
          echo "::notice::formfeed@$FORMFEED_VERSION previews the default data sets only; data-sets and compare need a later version"
        fi
        status=0
        npx --yes "formfeed@$FORMFEED_VERSION" "${args[@]}" || status=$?
        if [ -f formfeed-preview/preview.json ]; then
          node -e 'const r = require("./formfeed-preview/preview.json"); console.log("pages-changed=" + (r.pages_changed ?? 0))' >> "$GITHUB_OUTPUT"
        fi
        exit "$status"

    - name: Upload the previews
      if: always() && steps.preview.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: formfeed-preview
        path: |
          ${{ inputs.working-directory }}/formfeed-preview/
          ${{ inputs.working-directory }}/formfeed-preview.md
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: always() && steps.preview.outcome != 'skipped' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SUMMARY: ${{ steps.preview.outputs.summary }}
      run: node "$GITHUB_ACTION_PATH/scripts/comment.mjs" "$SUMMARY"

    - name: Publish
      if: inputs.publish == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORMFEED_VERSION: ${{ inputs.version }}
        FORMFEED_API_KEY: ${{ inputs.api-key }}
        CHANNEL: ${{ inputs.channel }}
        NOTE: ${{ github.sha }}
      run: |
        if [ -n "$CHANNEL" ]; then
          npx --yes "formfeed@$FORMFEED_VERSION" templates push --channel "$CHANNEL" --message "$NOTE" --ci
        else
          npx --yes "formfeed@$FORMFEED_VERSION" templates push --publish --message "$NOTE" --ci
        fi
